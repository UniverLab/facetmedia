[project]
name = "facetmedia"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

# Development tools live in a dependency group (PEP 735), not in an extra:
# `uv sync` installs it by default, and the lab's quality gate (deptry) would
# otherwise report pytest, ruff and mypy as unused runtime dependencies.
[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
facetmedia = "facetmedia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# python-ci gates coverage at 80 % by default.
[tool.coverage.run]
source = ["facetmedia"]
branch = true
