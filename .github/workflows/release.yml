name: Release

# Trunk-based release (decision 10eadef1), run by hand on main, like the lab's
# crates on UniverLab/workflows rust-release-manual.yml:
#
#   ci       - this repo's CI on main (each PR was checked alone; main is where they meet)
#   version  - refuses unless pyproject.toml carries a version with no tag yet;
#              the version is raised beforehand by a `chore(release): <version>` PR
#   build    - wheel and sdist
#   publish  - PyPI in the `production` environment (owner approval, main only),
#              Trusted Publishing (OIDC): no token is stored anywhere
#   release  - tag + GitHub release, only after PyPI accepted the files
#
# PyPI does not accept a reusable workflow as a Trusted Publisher
# (pypi/warehouse#11096), so the publish job lives here. PyPI trusts:
# owner UniverLab, repository facetmedia, workflow release.yml, environment production.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    name: Check Version Bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases run from main only (this run is on ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          # PEP 440 pre-releases (0.1.0b1, 0.2.0rc1) and dev versions are marked as pre-releases.
          if echo "$VERSION" | grep -Eq '(a|b|rc|\.dev)[0-9]+'; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Check the version was bumped
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.version.outputs.tag }} is already released. Raise the version in pyproject.toml (and uv.lock) in a chore(release) PR first."
            exit 1
          fi

  build:
    name: Build
    needs: [ci, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build wheel and sdist
        run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [version, build]
    # Waits for the owner's approval; the environment only accepts main.
    environment:
      name: production
      url: https://pypi.org/p/facetmedia
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    name: Tag and GitHub Release
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "Release ${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*
