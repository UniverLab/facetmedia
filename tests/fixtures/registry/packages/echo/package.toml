name = "echo"
version = "0.1.0"
requires_facet = ">=0.1.0.dev0,<0.2"
protocol = 1
provider = "facet"
tool_name = "Echo"
description = "Echo text back; the dependency-free registry fixture."

[engine]
type = "python-env"
python = "3.12"

[transport]
type = "cli"
entry = "runner.py"

[requirements]
gpu = false
ram_gb = 0.1
disk_gb = 0.01
exclusive = false
platforms = ["linux"]
host_libs = []
host_hint = ""

[[licenses]]
subject = "echo"
spdx = "Apache-2.0"

[capabilities.text]
summary = "Echo text back, repeated."
kind = "text"

[capabilities.text.inputs.text]
type = "string"
required = true
description = "Text to echo."

[capabilities.text.inputs.repeat]
type = "integer"
default = 1
min = 1
max = 10

[capabilities.text.preview]
viewer = "generic"
